<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#08080a">
<title>pixelform — Örnek Web Siteleri</title>
<meta name="description" content="pixelform ile tasarlanan örnek web siteleri. Kaydırın, ortadaki siteyi canlı olarak kullanın.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4.5' fill='%23b9b6ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#" id="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="wordmark">pixelform</span>
    </a>

    <div class="seg" id="modes" role="group" aria-label="Görünüm">
      <button type="button" data-mode="desktop" class="on">Masaüstü</button>
      <button type="button" data-mode="mobile">Mobil</button>
      <span class="seg-pill" aria-hidden="true"></span>
    </div>

    <a class="ghost" id="openLive" href="#" target="_blank" rel="noopener">
      <span>Siteyi aç</span>
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <main class="stage" id="stage" aria-label="Örnek siteler">
    <div class="track" id="track"></div>
  </main>

  <footer class="bar">
    <div class="dots" id="dots" role="tablist" aria-label="Site seç"></div>

    <div class="barrow">
      <button type="button" class="nav" id="prev" aria-label="Önceki site">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="info">
        <div class="count"><b id="idx">01</b><i>/</i><span id="total">06</span></div>
        <div class="txt">
          <h1 id="sname">—</h1>
          <p id="sdesc">—</p>
        </div>
      </div>

      <button type="button" class="nav" id="next" aria-label="Sonraki site">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 12h18M17 7l5 5-5 5M7 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Kaydırarak gezin · ortadaki site canlı</span>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
